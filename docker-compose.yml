version: "3.9"

# RecallOps local stack.
#
#   docker compose up -d hindsight     # memory layer only
#   docker compose up -d              # memory layer + API
#
# Hindsight needs an LLM key of its own to extract facts during `retain`.
# The RecallOps API is intentionally a plain uvicorn container: no build kit,
# no orchestration framework, nothing else to learn.

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: recallops-hindsight
    ports:
      - "8888:8888"
    environment:
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
      OPENAI_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: python:3.12-slim
    container_name: recallops-api
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir -q fastapi 'uvicorn[standard]' pydantic
      pydantic-settings sqlalchemy httpx python-dotenv hindsight-client &&
      uvicorn recallops.main:app --host 0.0.0.0 --port 8765 --host 0.0.0.0"
    ports:
      - "8765:8765"
    environment:
      HINDSIGHT_BASE_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
      HINDSIGHT_BANK_ID: recallops-org
      LLM_PROVIDER: ${LLM_PROVIDER:-local_heuristic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      DATABASE_URL: sqlite:////app/recallops.db
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:4321
    volumes:
      - .:/app
    depends_on:
      hindsight:
        condition: service_started
